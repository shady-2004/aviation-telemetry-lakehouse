aviation_lakehouse:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: /opt/airflow/dbt/dev.duckdb
      threads: 1
      external_root: "s3://aviation-lakehouse"

      extensions:
        - httpfs
        - parquet

      secrets:
        - type: s3
          key_id: minioadmin
          secret: minioadmin
          endpoint: minio:9000
          use_ssl: false
          url_style: path
          region: us-east-1

      attach:
        - path: "dbname=aviation_db user=postgres password=postgres host=postgres port=5432"
          type: postgres
          alias: postgres_db