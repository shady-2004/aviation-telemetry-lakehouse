version: 2

sources:
  - name: ourairports
    meta: 
      external_location: 's3://bronze/ourairports/airports.csv'
    tables:
      - name: raw_airports
        
  - name: opensky
    meta: 
      external_location: 's3://bronze/opensky/*/*.json'
    tables:
      - name: raw_flights

  - name: postgres
    tables:
      - name: raw_routes
        meta: 
          external_location: 's3://bronze/postgres/routes.parquet'
      - name: raw_airlines
        meta: 
          external_location: 's3://bronze/postgres/airlines.parquet'

    